<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SENTE GO</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#0b0e14;color:#eef1f6}
  main{width:min(88vw,360px);text-align:center}
  h1{font-size:15px;font-weight:600;color:#8f99a8;margin:0 0 18px;letter-spacing:.08em}
  a.go{display:block;padding:18px 16px;border-radius:14px;background:#8a96ff;color:#0b0e14;font-size:17px;font-weight:700;text-decoration:none}
  p{font-size:13px;color:#8f99a8;line-height:1.7;margin:16px 0 0}
</style>
</head>
<body>
<main>
  <h1>SENTE</h1>
  <a class="go" id="go" href="#">ショートカットを実行</a>
  <p id="msg">自動で始まらないときは、上のボタンを押してください。</p>
</main>
<script>
  // 呼べるショートカットは、ここに書いた名前だけ。ほかの名前は受け付けない。
  var MAP = { gmail: 'Gmail開く', update: 'SENTE更新' };
  var key = new URLSearchParams(location.search).get('s') || '';
  var name = MAP[key];
  var go = document.getElementById('go'), msg = document.getElementById('msg');
  if (!name) {
    go.removeAttribute('href'); go.style.opacity = .4;
    go.textContent = '呼び先が指定されていません';
    msg.textContent = 'アドレスの最後に ?s=gmail か ?s=update を付けて開いてください。';
  } else {
    var url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name);
    go.href = url;
    go.textContent = '「' + name + '」を実行';
    setTimeout(function(){ location.href = url; }, 300);
  }
</script>
</body>
</html>
